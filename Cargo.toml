[workspace]
resolver = "3"
members = ["crates/model", "crates/compositor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
publish = false

[workspace.dependencies]
coquille-model = { path = "crates/model" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "deny"

[profile.release]
# Line numbers in the backtrace of a real-world crash...
debug = "line-tables-only"

# ...but only for this workspace: for every dependency they would triple the
# size of the binary.
[profile.release.package."*"]
debug = false
