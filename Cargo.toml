[workspace]
resolver = "3"
members = [
    "crates/model",
    "crates/ipc",
    "crates/apps",
    "crates/config",
    "crates/theme",
    "crates/ui",
    "crates/compositor",
    "crates/dock",
    "crates/settings",
    "crates/keyring",
    "crates/polkit",
]
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
publish = false

[workspace.dependencies]
coquille-model = { path = "crates/model" }
coquille-ipc = { path = "crates/ipc" }
coquille-apps = { path = "crates/apps" }
coquille-config = { path = "crates/config" }
coquille-theme = { path = "crates/theme" }
coquille-ui = { path = "crates/ui" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml_edit = "0.25"
tracing = "0.1"
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "process", "rt", "macros"] }
iced = { version = "0.14", default-features = false, features = ["wgpu", "tiny-skia", "wayland", "crisp", "web-colors", "tokio", "svg", "image", "advanced"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# iced_layershell (the dock) is written for winit-core 0.31.0-beta.2, Smithay
# (the compositor) pins 0.31.0-beta.3, and a workspace holds only one of the
# two. This copy of iced_exdevtools 0.19.1 differs from the published one by a
# single match arm, see `vendor/README.md`. To drop once iced_layershell
# follows winit.
[patch.crates-io]
iced_exdevtools = { path = "vendor/iced_exdevtools" }
iced_wgpu = { path = "vendor/iced_wgpu" }

# The pinned Smithay commit, with one fix to the X11 clipboard bridge, see
# `vendor/README.md`. To drop once Smithay carries it.
[patch."https://github.com/Smithay/smithay.git"]
smithay = { path = "vendor/smithay" }

[workspace.lints.rust]
unsafe_code = "deny"

[profile.release]
# Line numbers in the backtrace of a real-world crash...
debug = "line-tables-only"

# ...but only for this workspace: for every dependency they would triple the
# size of the binary.
[profile.release.package."*"]
debug = false
