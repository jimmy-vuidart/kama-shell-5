    let toastTimer = null;
    function toast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 2300);
    }

    function updateClock() {
      const now = new Date();
      document.getElementById('clock-time').textContent =
        `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
      const dayShort = now.toLocaleDateString('fr-FR', { weekday: 'short' }).replace('.', '').slice(0, 3).toUpperCase();
      document.getElementById('clock-date').textContent = `${dayShort} ${String(now.getDate()).padStart(2, '0')}`;
      const full = now.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
      document.getElementById('clock-box').setAttribute('data-tip', full[0].toUpperCase() + full.slice(1));
    }

    function visibleWindowOn(screen) {
      return state.windows.find(w => w.screen === screen && !w.minimized && w.active)
        || state.windows.find(w => w.screen === screen && !w.minimized)
        || null;
    }

    function unreadCountFor(appId) {
      if (state.switches.dnd) return 0;
      return state.notifications.filter(n => n.appId === appId && n.unread).length;
    }

    function appMeta(id) {
      return state.windows.find(w => w.id === id) || state.catalog.find(a => a.id === id);
    }

    /* --- Contrôles de simulation --- */
    function setScreen(scr) {
      state.currentScreen = scr;
      ['left', 'center', 'right'].forEach(k => document.getElementById(`scr-${k}`).classList.toggle('active', k === scr));
      closeContextMenu();
      renderAll();
    }

    function setTheme(theme) {
      state.theme = theme;
      document.documentElement.setAttribute('data-theme', theme);
      document.getElementById('th-dark').classList.toggle('active', theme === 'dark');
      document.getElementById('th-light').classList.toggle('active', theme === 'light');
      if (state.popover === 'controls') renderPopover();
    }

    function setSide(side) {
      state.side = side;
      document.documentElement.setAttribute('data-side', side);
      document.getElementById('side-left').classList.toggle('active', side === 'left');
      document.getElementById('side-right').classList.toggle('active', side === 'right');
      closeContextMenu();
    }

    function setHost(host) {
      state.host = host;
      document.getElementById('host-zenbook').classList.toggle('active', host === 'zenbook');
      document.getElementById('host-titan').classList.toggle('active', host === 'titan');
      document.getElementById('pill-battery').classList.toggle('hidden', host === 'titan');
      if (state.popover === 'controls') renderPopover();
      toast(host === 'zenbook' ? 'Profil Zenbook (batterie + luminosité)' : 'Profil TITAN (PC fixe)');
    }

    /* --- Gestion des fenêtres maximisées + téléportation --- */
    function activateOrTeleport(appId, targetScreen = state.currentScreen) {
      closePopover();
      closeContextMenu();
      const meta = appMeta(appId);
      if (!meta) return;

      let win = state.windows.find(w => w.id === appId);
      if (!win) {
        win = { id: appId, name: meta.name, subtitle: meta.sub || 'Application active', screen: targetScreen, minimized: false, active: true };
        state.windows.push(win);
      } else {
        if (win.screen !== targetScreen) {
          const prevScreen = win.screen;
          win.screen = targetScreen;
          win.minimized = false;
          // Active la fenêtre suivante sur l'ancien écran s'il en reste une
          const fallback = state.windows.find(w => w.screen === prevScreen && !w.minimized);
          if (fallback) fallback.active = true;
          toast(`${win.name} téléporté vers ${state.screens[targetScreen].label}`);
        } else if (win.minimized) {
          win.minimized = false;
        }
      }

      // Met cette fenêtre au sommet de la pile maximisée de targetScreen
      state.windows.forEach(w => { if (w.screen === targetScreen) w.active = (w.id === appId); });
      state.screens[targetScreen].overlayOpen = false;

      // Marque comme lues les notifications de cette appli
      state.notifications.forEach(n => { if (n.appId === appId) n.unread = false; });

      renderAll();
    }

    function handleTaskbarClick(appId) {
      const win = state.windows.find(w => w.id === appId);
      const vis = visibleWindowOn(state.currentScreen);
      if (win && win.screen === state.currentScreen && !win.minimized && vis && vis.id === appId && !state.screens[state.currentScreen].overlayOpen) {
        // Déjà active sur cet écran -> ouvre le Lanceur Spatial flouté par-dessus
        state.screens[state.currentScreen].overlayOpen = true;
        renderAll();
        return;
      }
      activateOrTeleport(appId, state.currentScreen);
    }

    function toggleHomeOverlay() {
      closePopover();
      closeContextMenu();
      const vis = visibleWindowOn(state.currentScreen);
      if (!vis) {
        // Déjà sur le Lanceur Spatial permanent (aucune fenêtre visible)
        document.getElementById('search-input').focus();
        toast('Accueil spatial déjà affiché (aucune fenêtre ouverte sur cet écran)');
        return;
      }
      state.screens[state.currentScreen].overlayOpen = !state.screens[state.currentScreen].overlayOpen;
      renderAll();
      if (state.screens[state.currentScreen].overlayOpen) {
        setTimeout(() => document.getElementById('search-input').focus(), 40);
      }
    }

    function minimizeActiveApp() {
      const vis = visibleWindowOn(state.currentScreen);
      if (!vis) return;
      vis.minimized = true;
      vis.active = false;
      const next = state.windows.find(w => w.screen === state.currentScreen && !w.minimized);
      if (next) next.active = true;
      else toast('Toutes les fenêtres réduites : Lanceur Spatial affiché automatiquement');
      renderAll();
    }

    function closeApp(appId) {
      closeContextMenu();
      const win = state.windows.find(w => w.id === appId);
      if (!win) return;
      const scr = win.screen;
      state.windows = state.windows.filter(w => w.id !== appId);
      const next = state.windows.find(w => w.screen === scr && !w.minimized);
      if (next) next.active = true;
      toast(`${win.name} fermé`);
      renderAll();
    }

    function closeActiveApp() {
      const vis = visibleWindowOn(state.currentScreen);
      if (vis) closeApp(vis.id);
    }

    function togglePin(appId) {
      closeContextMenu();
      const meta = appMeta(appId);
      if (state.pinned.includes(appId)) {
        state.pinned = state.pinned.filter(x => x !== appId);
        toast(`${meta.name} retirée des favoris`);
      } else {
        state.pinned.push(appId);
        toast(`${meta.name} épinglée à la barre`);
      }
      renderAll();
    }

    /* --- Menu contextuel clic droit (conservé à l'identique) --- */
    function openContextMenu(event, appId) {
      event.preventDefault();
      event.stopPropagation();
      closePopover();
      const meta = appMeta(appId);
      if (!meta) return;
      const win = state.windows.find(w => w.id === appId);
      const isPinned = state.pinned.includes(appId);
      const menu = document.getElementById('context-menu');

      menu.innerHTML = `
        <div class="ctx-head">
          <div style="font-size:13px;font-weight:600;">${meta.name}</div>
          <div style="font-size:11px;color:var(--muted);">${win ? (win.minimized ? 'Réduite · ' : '') + state.screens[win.screen].label : 'Fermée'}</div>
        </div>
        <div style="font-size:10.5px;color:var(--muted);padding:2px 8px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;">Ouvrir / téléporter sur</div>
        <div class="ctx-screens">
          <button class="ctx-screen-btn" onclick="activateOrTeleport('${appId}','left')">Gauche</button>
          <button class="ctx-screen-btn" onclick="activateOrTeleport('${appId}','center')">Centre</button>
          <button class="ctx-screen-btn" onclick="activateOrTeleport('${appId}','right')">Droite</button>
        </div>
        <button class="ctx-item" onclick="activateOrTeleport('${appId}');toast('Nouvelle fenêtre : ${meta.name}')">Nouvelle fenêtre</button>
        <button class="ctx-item" onclick="togglePin('${appId}')">${isPinned ? 'Retirer des favoris' : 'Épingler à la barre'}</button>
        ${win ? `<button class="ctx-item danger" onclick="closeApp('${appId}')">Fermer</button>` : ''}
      `;
      menu.classList.remove('hidden');

      const x = state.side === 'left' ? 64 : window.innerWidth - 64 - 224;
      const y = Math.min(event.clientY, window.innerHeight - menu.offsetHeight - 16);
      menu.style.left = `${x}px`;
      menu.style.top = `${Math.max(12, y)}px`;
    }

    function closeContextMenu() {
      document.getElementById('context-menu').classList.add('hidden');
    }

    /* --- Popovers découplés : Notifications SEUL ou Centre de contrôle SEUL + Mixeur --- */
    function togglePopover(kind) {
      closeContextMenu();
      if (state.popover === kind) {
        closePopover();
        return;
      }
      state.popover = kind;
      if (kind !== 'controls') state.mixerOpen = false;
      state.confirmAction = null;
      renderPopover();
      renderSidebarPill();
    }

    function closePopover() {
      state.popover = null;
      state.mixerOpen = false;
      state.confirmAction = null;
      document.getElementById('popover-anchor').classList.add('is-hidden');
      document.getElementById('mixer-panel').classList.add('hidden');
      renderSidebarPill();
    }

    function renderSidebarPill() {
      document.getElementById('pill-notifs').classList.toggle('is-open', state.popover === 'notifications');
      document.getElementById('pill-controls').classList.toggle('is-open', state.popover === 'controls');
      const unread = state.notifications.filter(n => n.unread).length;
      document.getElementById('pill-notif-dot').classList.toggle('hidden', unread === 0 || state.switches.dnd);
      document.getElementById('pill-wifi').style.opacity = state.switches.network ? '1' : '0.35';
      document.getElementById('pill-audio-hp').classList.toggle('hidden', state.audioSink !== 'Casque USB');
      document.getElementById('pill-audio-sp').classList.toggle('hidden', state.audioSink === 'Casque USB');
    }

    function renderPopover() {
      const anchor = document.getElementById('popover-anchor');
      const body = document.getElementById('popover-body');
      const mixer = document.getElementById('mixer-panel');

      if (!state.popover) {
        anchor.classList.add('is-hidden');
        return;
      }
      anchor.classList.remove('is-hidden');

      if (state.popover === 'notifications') {
        mixer.classList.add('hidden');
        const list = state.notifications;
        body.innerHTML = `
          <div style="display:flex;align-items:center;justify-content:space-between;">
            <div style="display:flex;align-items:baseline;gap:8px;">
              <strong style="font-size:14px;font-weight:600;">Notifications</strong>
              <span style="font-size:12px;color:var(--muted);" class="tabular">${list.length || ''}</span>
            </div>
            ${list.length ? `<button onclick="clearNotifications()" style="font-size:12px;font-weight:500;color:var(--muted);padding:4px 8px;border-radius:8px;">Tout effacer</button>` : ''}
          </div>
          ${list.length === 0 ? `
            <div style="padding:36px 12px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:8px;">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 2h-15z"/><path d="M10 20.5a2.2 2.2 0 0 0 4 0"/></svg>
              <div style="font-size:13px;font-weight:500;">Aucune notification</div>
              ${state.switches.dnd ? `<div style="font-size:11px;">Ne pas déranger : elles attendent ici.</div>` : ''}
            </div>
          ` : `
            <div style="display:flex;flex-direction:column;gap:7px;">
              ${list.map(n => `
                <div class="notice-card" onclick="clickNotification('${n.id}')">
                  <div class="notice-top">
                    <div style="display:flex;align-items:center;gap:7px;min-width:0;">
                      ${n.unread ? `<span style="width:7px;height:7px;border-radius:999px;background:var(--accent);flex-shrink:0;"></span>` : ''}
                      <span style="font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${n.title}</span>
                    </div>
                    <button class="notice-close" onclick="event.stopPropagation();dismissNotification('${n.id}')">×</button>
                  </div>
                  <div style="font-size:11px;color:var(--muted);">${n.app} · ${n.time}</div>
                  <div style="font-size:12px;color:var(--text);opacity:0.86;line-height:1.35;">${n.body}</div>
                </div>
              `).join('')}
            </div>
          `}
        `;
        return;
      }

      /* Centre de contrôle existant coquille (ui/drawer.rs : switches 2×N, volume + chevron mixeur, luminosité, session) */
      const sw = (key, title, sub, active) => `
        <button class="cc-switch ${active ? 'on' : ''}" onclick="toggleSwitch('${key}')">
          <div style="min-width:0;">
            <div class="cc-switch-title">${title}</div>
            <div class="cc-switch-sub">${sub}</div>
          </div>
        </button>`;

      const foot = state.confirmAction ? `
        <div style="display:flex;flex-direction:column;gap:8px;">
          <div style="font-size:13.5px;font-weight:600;">${state.confirmAction} ?</div>
          <div style="display:flex;gap:8px;">
            <button class="cc-pill-badge" style="flex:1;text-align:center;" onclick="state.confirmAction=null;renderPopover()">Annuler</button>
            <button class="cc-pill-badge" style="flex:1;text-align:center;background:var(--danger);color:#fff;" onclick="toast('${state.confirmAction} (simulé)');state.confirmAction=null;closePopover()">Confirmer</button>
          </div>
        </div>
      ` : `
        <div class="cc-session-who">
          <div class="cc-avatar">J</div>
          <div style="min-width:0;">
            <div style="font-size:13.5px;font-weight:600;">Jimmy</div>
            <div style="font-size:11.5px;color:var(--muted);">${state.host === 'zenbook' ? 'Batterie 96 % · Sur secteur' : 'KAMA-TITAN · Compte local'}</div>
          </div>
        </div>
        <div class="cc-session-actions">
          <button class="cc-session-btn" title="Capture d'écran" onclick="toast('Capture d’écran (région / écran)')">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
          </button>
          <button class="cc-session-btn" title="Paramètres" onclick="activateOrTeleport('settings')">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
          </button>
          <button class="cc-session-btn" title="Se déconnecter" onclick="state.confirmAction='Se déconnecter';renderPopover()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4"/><path d="m15 8 4 4-4 4"/><path d="M19 12H9"/></svg>
          </button>
          <button class="cc-session-btn" title="Mettre en veille" onclick="state.confirmAction='Mettre en veille';renderPopover()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20.5 13.5A8.5 8.5 0 1 1 10.5 3.5a6.8 6.8 0 0 0 10 10z"/></svg>
          </button>
          <button class="cc-session-btn" title="Redémarrer" onclick="state.confirmAction='Redémarrer l’ordinateur';renderPopover()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg>
          </button>
          <button class="cc-session-btn danger" title="Éteindre" onclick="state.confirmAction='Éteindre l’ordinateur';renderPopover()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v9"/><path d="M17.7 6.8a8 8 0 1 1-11.4 0"/></svg>
          </button>
        </div>
      `;

      body.innerHTML = `
        <div class="cc-card">
          <div class="cc-switches">
            ${sw('network', 'Réseau', state.switches.network ? (state.host === 'titan' ? 'Ethernet' : 'Freebox-CC81') : 'Désactivé', state.switches.network)}
            ${sw('bluetooth', 'Bluetooth', state.switches.bluetooth ? 'Casque' : 'Désactivé', state.switches.bluetooth)}
            ${sw('dnd', 'Ne pas déranger', state.switches.dnd ? 'Activé' : 'Désactivé', state.switches.dnd)}
            ${sw('nightlight', 'Éclairage nocturne', state.switches.nightlight ? 'Activé' : 'Désactivé', state.switches.nightlight)}
            ${sw('dark', 'Thème sombre', state.theme === 'dark' ? 'Activé' : 'Désactivé', state.theme === 'dark')}
          </div>

          <!-- Volume + chevron Mixeur par application -->
          <div class="cc-slider-row">
            <button class="cc-icon-btn" style="${state.muted ? 'color:var(--danger)' : ''}" onclick="state.muted=!state.muted;renderPopover()" title="Couper le son">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/>${state.muted ? '<path d="m16 9.5 5 5M21 9.5l-5 5"/>' : '<path d="M15.5 9a4 4 0 0 1 0 6"/>'}</svg>
            </button>
            <input class="coquille-slider" type="range" min="0" max="100" value="${state.volume}" oninput="state.volume=Number(this.value);if(state.mixerOpen)renderMixer()" />
            <button class="cc-icon-btn ${state.mixerOpen ? 'on' : ''}" onclick="state.mixerOpen=!state.mixerOpen;renderPopover()" title="Mixeur par application">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="${state.side === 'left' ? 'm9 6 6 6-6 6' : 'm15 6-6 6 6 6'}"/></svg>
            </button>
          </div>

          <!-- Luminosité -->
          <div class="cc-slider-row">
            <span class="cc-icon-btn" style="background:transparent;cursor:default;">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2"/></svg>
            </span>
            ${state.host === 'zenbook'
              ? `<input class="coquille-slider" type="range" min="20" max="100" value="${state.brightness}" oninput="state.brightness=Number(this.value)" /><span class="cc-pill-badge">1 écran</span>`
              : `<div style="flex:1;"></div><span class="cc-pill-badge" style="color:var(--muted);">indisponible</span>`
            }
          </div>

          <div style="height:1px;background:var(--separator);"></div>
          ${foot}
        </div>
      `;

      if (state.mixerOpen) {
        mixer.classList.remove('hidden');
        renderMixer();
      } else {
        mixer.classList.add('hidden');
      }
    }

    function renderMixer() {
      const mixer = document.getElementById('mixer-panel');
      mixer.innerHTML = `
        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
          <strong style="font-size:13.5px;font-weight:600;">Volume par application</strong>
          <button class="cc-pill-badge" onclick="cycleAudioSink()" title="Changer la sortie audio">${state.audioSink} ▾</button>
        </div>
        <div style="display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:10px;background:var(--card);">
          <span style="font-size:12.5px;font-weight:600;width:54px;">Général</span>
          <input class="coquille-slider" type="range" min="0" max="100" value="${state.volume}" oninput="state.volume=Number(this.value);renderPopover()" />
          <span style="font-size:11.5px;color:var(--muted);width:26px;text-align:right;" class="tabular">${state.volume}</span>
        </div>
        <div style="display:flex;flex-direction:column;gap:10px;">
          ${state.mixerStreams.map((s, idx) => `
            <div style="display:flex;align-items:center;gap:8px;">
              ${iconSvg(s.id, 26)}
              <div style="width:78px;min-width:0;">
                <div style="font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${s.name}</div>
                <div style="font-size:10.5px;color:${s.muted ? 'var(--danger)' : 'var(--muted)'};">${s.muted ? 'Coupé' : s.state}</div>
              </div>
              <div style="flex:1;display:flex;flex-direction:column;gap:3px;">
                <input class="coquille-slider" type="range" min="0" max="100" value="${s.volume}" oninput="state.mixerStreams[${idx}].volume=Number(this.value)" />
                <div style="height:2px;background:var(--separator);border-radius:99px;overflow:hidden;">
                  <div style="height:100%;width:${s.muted ? 0 : Math.round(s.level * s.volume)}%;background:var(--level);"></div>
                </div>
              </div>
              <button class="cc-icon-btn" style="width:26px;height:26px;${s.muted ? 'background:var(--danger-soft);color:var(--danger)' : ''}" onclick="state.mixerStreams[${idx}].muted=!state.mixerStreams[${idx}].muted;renderMixer()">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/>${s.muted ? '<path d="m16 9.5 5 5M21 9.5l-5 5"/>' : '<path d="M15.5 9a4 4 0 0 1 0 6"/>'}</svg>
              </button>
            </div>
          `).join('')}
        </div>
        <div style="height:1px;background:var(--separator);"></div>
        <div style="font-size:11px;color:var(--muted);line-height:1.35;">Chaque appli retrouve son volume à la prochaine ouverture.</div>
      `;
    }

    function cycleAudioSink() {
      state.audioSink = state.audioSink === 'Casque USB' ? 'Haut-parleurs' : 'Casque USB';
      renderMixer();
      renderSidebarPill();
      toast(`Sortie audio : ${state.audioSink}`);
    }

    function toggleSwitch(key) {
      if (key === 'dark') {
        setTheme(state.theme === 'dark' ? 'light' : 'dark');
        return;
      }
      state.switches[key] = !state.switches[key];
      renderPopover();
      renderSidebarPill();
      renderTaskbar();
    }

    function clickNotification(id) {
      const n = state.notifications.find(x => x.id === id);
      if (!n) return;
      n.unread = false;
      if (n.appId) activateOrTeleport(n.appId, state.currentScreen);
      else { renderPopover(); renderSidebarPill(); }
    }

    function dismissNotification(id) {
      state.notifications = state.notifications.filter(x => x.id !== id);
      renderPopover();
      renderSidebarPill();
      renderTaskbar();
    }

    function clearNotifications() {
      state.notifications = [];
      renderPopover();
      renderSidebarPill();
      renderTaskbar();
    }

    /* --- Rendu Barre des tâches (alignée en haut) --- */
    function renderTaskbar() {
      const vis = visibleWindowOn(state.currentScreen);
      const launcherVisible = !vis || state.screens[state.currentScreen].overlayOpen;
      document.getElementById('btn-home').classList.toggle('is-active', launcherVisible);
      document.getElementById('home-mark').classList.toggle('hidden', !launcherVisible);

      const pinnedItems = state.pinned.map(appMeta).filter(Boolean);
      const unpinnedOpen = state.windows.filter(w => !state.pinned.includes(w.id));

      const itemHtml = (app) => {
        const win = state.windows.find(w => w.id === app.id);
        const onThis = Boolean(win && win.screen === state.currentScreen);
        const onOther = Boolean(win && win.screen !== state.currentScreen);
        const isActive = Boolean(vis && vis.id === app.id && !launcherVisible);
        const unread = unreadCountFor(app.id);

        let mark = '';
        if (isActive) mark = '<span class="sb-mark sb-mark-bar"></span>';
        else if (onThis) mark = '<span class="sb-mark sb-mark-dot"></span>';
        else if (onOther) mark = '<span class="sb-mark sb-mark-ring"></span>';

        let tip = app.name;
        if (!win) tip += ' · Épinglée';
        else if (onOther) tip += ` · ${state.screens[win.screen].label} (clic pour téléporter)`;
        else if (win.minimized) tip += ' · Réduite';
        else tip += ' · Sur cet écran';
        if (unread > 0) tip += ` · ${unread} non lue${unread > 1 ? 's' : ''}`;

        return `
          <button
            class="sb-btn has-tip ${isActive ? 'is-active' : win ? 'is-running' : ''}"
            data-tip="${tip}"
            onclick="handleTaskbarClick('${app.id}')"
            oncontextmenu="openContextMenu(event, '${app.id}')"
            onauxclick="if(event.button===1){event.preventDefault();closeApp('${app.id}');}"
          >
            ${mark}
            ${iconSvg(app.id, 24)}
            ${unread > 0 ? `<span class="sb-badge tabular">${unread}</span>` : ''}
          </button>`;
      };

      let html = pinnedItems.map(itemHtml).join('');
      if (unpinnedOpen.length) {
        html += '<div class="sb-sep" style="margin:2px 0;"></div>';
        html += unpinnedOpen.map(itemHtml).join('');
      }
      document.getElementById('taskbar').innerHTML = html;
    }

    /* --- Rendu Scène : Fenêtre maximisée vs Lanceur Spatial (Bottom ou Overlay flouté) --- */
    function renderStage() {
      const vis = visibleWindowOn(state.currentScreen);
      const maxEl = document.getElementById('maximized-view');
      const launcher = document.getElementById('spatial-launcher');

      if (!vis) {
        // Aucune fenêtre visible -> Lanceur Spatial permanent directement sur le fond d'écran
        maxEl.classList.add('hidden');
        launcher.classList.remove('hidden', 'mode-overlay');
        launcher.classList.add('mode-bottom');
        return;
      }

      // Fenêtre maximisée bord à bord
      maxEl.classList.remove('hidden');
      document.getElementById('max-icon').innerHTML = iconSvg(vis.id, 22);
      document.getElementById('max-title').textContent = vis.name;
      document.getElementById('max-screen-badge').textContent = state.screens[state.currentScreen].label;
      document.getElementById('max-body').innerHTML = `
        <div class="liquid-panel" style="max-width:480px;width:100%;border-radius:20px;padding:30px;text-align:center;">
          <div style="display:flex;justify-content:center;margin-bottom:14px;">${iconSvg(vis.id, 58)}</div>
          <div style="font-size:20px;font-weight:700;">${vis.name}</div>
          <div style="font-size:13px;color:var(--muted);margin-top:4px;">${vis.subtitle}</div>
          <div style="font-size:12px;color:var(--muted);margin-top:16px;line-height:1.5;">
            Fenêtre systématiquement maximisée bord à bord sur <strong>${state.screens[state.currentScreen].label}</strong>.<br/>
            Clique <strong>Accueil</strong> (haut de barre) pour ouvrir le Lanceur Spatial flouté par-dessus, ou <strong>Réduire</strong> pour voir l'accueil permanent réapparaître.
          </div>
        </div>
      `;

      if (state.screens[state.currentScreen].overlayOpen) {
        launcher.classList.remove('hidden', 'mode-bottom');
        launcher.classList.add('mode-overlay');
      } else {
        launcher.classList.add('hidden');
      }
    }

    /* --- Rendu des 4 panneaux informatifs --- */
    function renderTasks() {
      const rem = state.tasks.filter(t => !t.done).length;
      document.getElementById('tasks-meta').textContent = `${rem} restante${rem > 1 ? 's' : ''}`;
      document.getElementById('tasks-list').innerHTML = state.tasks.map(t => `
        <button class="task-row ${t.done ? 'done' : ''}" onclick="toggleTask('${t.id}')">
          <span style="display:flex;align-items:center;gap:10px;min-width:0;">
            <span class="task-check">${t.done ? '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>' : ''}</span>
            <span style="font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;${t.done ? 'text-decoration:line-through;' : ''}">${t.title}</span>
          </span>
          <span style="font-size:11.5px;color:var(--muted);flex-shrink:0;">${t.meta}</span>
        </button>
      `).join('');
    }

    function toggleTask(id) {
      const t = state.tasks.find(x => x.id === id);
      if (t) { t.done = !t.done; renderTasks(); }
    }

    function renderProjects() {
      document.getElementById('projects-list').innerHTML = state.projects.map(p => `
        <button class="ticket-row" onclick="toast('Ouverture de ${p.id} (${p.project})')">
          <div style="min-width:0;">
            <div style="font-size:11.5px;color:var(--muted);display:flex;gap:6px;align-items:center;">
              <span style="font-weight:600;color:var(--accent);">${p.id}</span>
              <span>·</span>
              <span>${p.project}</span>
            </div>
            <div style="font-size:13px;font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${p.title}</div>
          </div>
          <span class="status-pill">${p.status}</span>
        </button>
      `).join('');
    }

    /* Jeux + édition à la volée du commentaire */
    function renderGames() {
      document.getElementById('games-grid').innerHTML = state.games.map(g => {
        const editing = state.editingGameId === g.id;
        return `
          <div class="game-card" style="background:${g.bg};" onclick="launchGame('${g.id}')">
            <div class="game-top">
              <span class="game-pill tabular">${g.lastPlayed}</span>
              <span class="game-play" title="Lancer ${g.title}">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor" style="margin-left:1px;"><polygon points="6 4 20 12 6 20 6 4"/></svg>
              </span>
            </div>
            <div class="game-bottom">
              <div style="font-size:14px;font-weight:700;line-height:1.25;">${g.title}</div>
              ${editing ? `
                <input
                  id="game-note-input-${g.id}"
                  class="game-note-input"
                  value="${g.note.replace(/"/g, '&quot;')}"
                  placeholder="Ajouter un commentaire…"
                  onclick="event.stopPropagation()"
                  onkeydown="onGameNoteKey(event, '${g.id}')"
                  onblur="saveGameNote('${g.id}', this.value)"
                />
              ` : `
                <div class="game-note-row" onclick="startEditGameNote(event, '${g.id}')" title="Cliquer pour modifier le commentaire">
                  <span class="game-note-text">${g.note || 'Ajouter un commentaire…'}</span>
                  <svg class="game-note-edit-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>
                  </svg>
                </div>
              `}
            </div>
          </div>`;
      }).join('');

      if (state.editingGameId) {
        const input = document.getElementById(`game-note-input-${state.editingGameId}`);
        if (input) { input.focus(); input.select(); }
      }
    }

    function launchGame(id) {
      if (state.editingGameId) return;
      const g = state.games.find(x => x.id === id);
      if (g) toast(`Lancement de ${g.title} (plein écran ancré au centre)`);
    }

    function startEditGameNote(event, id) {
      event.stopPropagation();
      state.editingGameId = id;
      renderGames();
    }

    function saveGameNote(id, value) {
      if (state.editingGameId !== id) return;
      const g = state.games.find(x => x.id === id);
      if (g) {
        g.note = value.trim();
        savedGameNotes[id] = g.note;
        localStorage.setItem('coquille_proto_game_notes', JSON.stringify(savedGameNotes));
      }
      state.editingGameId = null;
      renderGames();
      toast('Commentaire enregistré');
    }

    function onGameNoteKey(event, id) {
      event.stopPropagation();
      if (event.key === 'Enter') {
        event.preventDefault();
        saveGameNote(id, event.target.value);
      } else if (event.key === 'Escape') {
        event.preventDefault();
        state.editingGameId = null;
        renderGames();
      }
    }

    function renderCalendar() {
      const today = new Date();
      const end = new Date(today);
      end.setDate(today.getDate() + 6);
      const fmt = d => d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' }).replace('.', '');
      document.getElementById('cal-range').textContent = `${fmt(today)} — ${fmt(end)}`;

      document.getElementById('cal-grid').innerHTML = state.calendar.map(ev => {
        const d = new Date(today);
        d.setDate(today.getDate() + ev.dayOffset);
        const day = ev.dayOffset === 0 ? 'Aujourd’hui'
          : ev.dayOffset === 1 ? 'Demain'
          : d.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' }).replace(/\./g, '');
        return `
          <button class="cal-item ${ev.dayOffset === 0 ? 'today' : ''}" onclick="toast('${day} · ${ev.time} — ${ev.title}')">
            <span class="cal-stripe" style="background:${ev.color};"></span>
            <div style="min-width:0;flex:1;">
              <div style="display:flex;justify-content:space-between;gap:6px;font-size:11px;">
                <span style="font-weight:600;color:${ev.dayOffset === 0 ? 'var(--accent)' : 'var(--muted)'};text-transform:capitalize;">${day}</span>
                <span class="tabular" style="color:var(--muted);">${ev.time}</span>
              </div>
              <div style="font-size:12.5px;font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${ev.title}</div>
            </div>
          </button>`;
      }).join('');
    }

    /* --- Grille flottante GNOME --- */
    function filteredApps() {
      const q = state.search.trim().toLowerCase();
      if (!q) return state.catalog;
      return state.catalog.filter(a => a.name.toLowerCase().includes(q) || a.sub.toLowerCase().includes(q) || a.kw.includes(q));
    }

    function renderApps() {
      const apps = filteredApps();
      const grid = document.getElementById('apps-grid');
      const empty = document.getElementById('apps-empty');
      if (!apps.length) {
        grid.innerHTML = '';
        empty.classList.remove('hidden');
        return;
      }
      empty.classList.add('hidden');
      grid.innerHTML = apps.map(a => {
        const win = state.windows.find(w => w.id === a.id);
        const dotClass = !win ? 'none' : (win.screen === state.currentScreen ? 'here' : 'elsewhere');
        return `
          <button class="app-tile" onclick="activateOrTeleport('${a.id}')" oncontextmenu="openContextMenu(event, '${a.id}')" title="${a.name} — ${a.sub}">
            <span class="app-icon-box">${iconSvg(a.id, 52)}</span>
            <span class="app-label">${a.name}</span>
            <span class="app-dot ${dotClass}"></span>
          </button>`;
      }).join('');
    }

    function onSearch(v) {
      state.search = v;
      document.getElementById('search-clear').classList.toggle('hidden', !v);
      renderApps();
    }

    function clearSearch() {
      const inp = document.getElementById('search-input');
      inp.value = '';
      state.search = '';
      document.getElementById('search-clear').classList.add('hidden');
      renderApps();
      inp.focus();
    }

    function onSearchKey(e) {
      if (e.key === 'Escape') {
        if (state.search) clearSearch();
        else if (state.screens[state.currentScreen].overlayOpen) {
          state.screens[state.currentScreen].overlayOpen = false;
          renderAll();
        }
      } else if (e.key === 'Enter') {
        const list = filteredApps();
        if (list.length) {
          activateOrTeleport(list[0].id);
          clearSearch();
        }
      }
    }

    function renderAll() {
      renderTaskbar();
      renderSidebarPill();
      renderStage();
      renderApps();
      if (state.popover) renderPopover();
    }

    document.addEventListener('click', (e) => {
      if (!e.target.closest('#context-menu')) closeContextMenu();
      if (state.popover && !e.target.closest('#popover-anchor') && !e.target.closest('.sb-pill')) {
        closePopover();
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (state.editingGameId) return;
        if (!document.getElementById('context-menu').classList.contains('hidden')) closeContextMenu();
        else if (state.popover) closePopover();
        else if (state.screens[state.currentScreen].overlayOpen) {
          state.screens[state.currentScreen].overlayOpen = false;
          renderAll();
        }
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      updateClock();
      setInterval(updateClock, 15000);
      renderTasks();
      renderProjects();
      renderGames();
      renderCalendar();
      renderAll();
    });
  </script>
</body>
</html>
