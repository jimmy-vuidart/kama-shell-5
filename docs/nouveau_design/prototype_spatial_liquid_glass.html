<!DOCTYPE html>
<html lang="fr" data-theme="dark" data-side="left">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>coquille — Prototype Mode Spatial (Liquid Glass)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* =========================================================================
       JETONS COQUILLE-THEME (crates/theme/src/lib.rs) — CLAIR & SOMBRE
       Matière : Verre liquide (réfraction, liseré rim, flou Kawase, Figtree)
       ========================================================================= */
    :root {
      --sidebar-w: 56px;
      --danger: #e5484d;
      --danger-soft: rgba(229, 72, 77, 0.16);
      --level: #3fb950;
      --radius-panel: 18px;
      --radius-card: 14px;
      --radius-tile: 12px;
    }

    html[data-theme="dark"] {
      --backdrop: #14121e;
      --glass: rgba(26, 22, 44, 0.50);
      --glass-strong: rgba(36, 32, 58, 0.84);
      --glass-clear: rgba(26, 22, 44, 0.34);
      --glass-overlay-bg: rgba(20, 17, 34, 0.56);
      --rim: rgba(215, 210, 255, 0.18);
      --rim-bright: rgba(215, 210, 255, 0.30);
      --specular: rgba(255, 255, 255, 0.14);
      --card: rgba(255, 255, 255, 0.075);
      --card-hover: rgba(255, 255, 255, 0.125);
      --hover: rgba(255, 255, 255, 0.10);
      --separator: rgba(255, 255, 255, 0.09);
      --text: #f1f2f4;
      --muted: #9498a4;
      --accent: #8f97ff;
      --accent-soft: rgba(143, 151, 255, 0.18);
      --on-accent: #14121e;
      --shadow: rgba(12, 8, 28, 0.45);
      --surface: #1c1a26;
      --label-shadow: 0 1px 4px rgba(10, 8, 22, 0.72);
      --game-scrim: linear-gradient(180deg, rgba(20, 17, 34, 0.18) 0%, rgba(20, 17, 34, 0.80) 100%);
    }

    html[data-theme="light"] {
      --backdrop: #e9e6f4;
      --glass: rgba(255, 255, 255, 0.50);
      --glass-strong: rgba(255, 255, 255, 0.84);
      --glass-clear: rgba(255, 255, 255, 0.24);
      --glass-overlay-bg: rgba(238, 235, 248, 0.56);
      --rim: rgba(255, 255, 255, 0.84);
      --rim-bright: rgba(255, 255, 255, 0.94);
      --specular: rgba(255, 255, 255, 0.75);
      --card: rgba(255, 255, 255, 0.62);
      --card-hover: rgba(255, 255, 255, 0.80);
      --hover: rgba(255, 255, 255, 0.42);
      --separator: rgba(30, 34, 60, 0.09);
      --text: #1d2033;
      --muted: #6b6f85;
      --accent: #5b63e6;
      --accent-soft: rgba(91, 99, 230, 0.14);
      --on-accent: #ffffff;
      --shadow: rgba(65, 50, 135, 0.18);
      --surface: #f6f5fb;
      --label-shadow: 0 1px 3px rgba(255, 255, 255, 0.85);
      --game-scrim: linear-gradient(180deg, rgba(20, 18, 36, 0.12) 0%, rgba(18, 16, 32, 0.78) 100%);
    }

    * {
      box-sizing: border-box;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Figtree', system-ui, -apple-system, sans-serif;
      background: var(--backdrop);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    button {
      font-family: inherit;
      color: inherit;
      background: none;
      border: 0;
      padding: 0;
      cursor: pointer;
    }

    input {
      font-family: inherit;
      color: inherit;
    }

    .tabular { font-variant-numeric: tabular-nums; }
    .hidden { display: none !important; }

    /* =========================================================================
       FOND D'ÉCRAN « GLASS » COQUILLE (vagues verre jour / nuit)
       ========================================================================= */
    #wallpaper {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      transition: background 320ms ease;
    }

    html[data-theme="light"] #wallpaper {
      background:
        radial-gradient(ellipse 68% 64% at 15% 12%, rgba(164, 183, 255, 0.78), transparent 65%),
        radial-gradient(ellipse 62% 62% at 88% 18%, rgba(248, 212, 198, 0.78), transparent 65%),
        radial-gradient(ellipse 72% 66% at 58% 88%, rgba(206, 194, 240, 0.82), transparent 68%),
        linear-gradient(135deg, #d7def8 0%, #e7dff2 50%, #f1ded8 100%);
    }

    html[data-theme="dark"] #wallpaper {
      background:
        radial-gradient(ellipse 68% 64% at 16% 16%, rgba(86, 102, 182, 0.42), transparent 64%),
        radial-gradient(ellipse 64% 58% at 86% 20%, rgba(140, 96, 128, 0.34), transparent 62%),
        radial-gradient(ellipse 74% 66% at 52% 92%, rgba(92, 82, 158, 0.36), transparent 66%),
        linear-gradient(140deg, #171828 0%, #242138 50%, #1c192b 100%);
    }

    /* Arches douces rappelant le fond par défaut « glass » des captures verre/ */
    .wp-arch {
      position: absolute;
      border-radius: 999px 999px 0 0;
      transform: rotate(-34deg);
      pointer-events: none;
      transition: background 320ms ease, border-color 320ms ease;
    }

    html[data-theme="light"] .wp-arch {
      background: linear-gradient(160deg, rgba(255, 255, 255, 0.42), rgba(215, 206, 244, 0.24));
      border: 1.5px solid rgba(255, 255, 255, 0.65);
      box-shadow: 0 -10px 40px rgba(90, 75, 155, 0.08);
    }

    html[data-theme="dark"] .wp-arch {
      background: linear-gradient(160deg, rgba(168, 174, 238, 0.16), rgba(92, 82, 138, 0.09));
      border: 1.5px solid rgba(215, 210, 255, 0.16);
      box-shadow: 0 -10px 40px rgba(8, 6, 20, 0.28);
    }

    .wp-arch-1 { width: 52vw; height: 95vh; left: -6vw; top: 18vh; }
    .wp-arch-2 { width: 48vw; height: 95vh; left: 26vw; top: 8vh; }
    .wp-arch-3 { width: 46vw; height: 95vh; left: 54vw; top: 24vh; }
    .wp-arch-4 { width: 44vw; height: 95vh; left: 76vw; top: 42vh; }

    /* =========================================================================
       SURFACES LIQUID GLASS COQUILLE
       ========================================================================= */
    .liquid-bar {
      background: var(--glass-clear);
      backdrop-filter: blur(26px) saturate(155%);
      -webkit-backdrop-filter: blur(26px) saturate(155%);
      box-shadow:
        inset 0 1px 0 var(--specular),
        0 0 28px var(--shadow);
    }

    html[data-side="left"] .liquid-bar {
      left: 0;
      right: auto;
      border-right: 1px solid var(--rim-bright);
    }

    html[data-side="right"] .liquid-bar {
      right: 0;
      left: auto;
      border-left: 1px solid var(--rim-bright);
    }

    .liquid-panel {
      background: var(--glass);
      backdrop-filter: blur(26px) saturate(150%);
      -webkit-backdrop-filter: blur(26px) saturate(150%);
      border: 1px solid var(--rim);
      box-shadow:
        inset 0 1px 0 var(--specular),
        0 14px 36px -12px var(--shadow);
    }

    .liquid-strong {
      background: var(--glass-strong);
      backdrop-filter: blur(30px) saturate(160%);
      -webkit-backdrop-filter: blur(30px) saturate(160%);
      border: 1px solid var(--rim-bright);
      box-shadow:
        inset 0 1px 0 var(--specular),
        0 20px 48px -10px var(--shadow);
    }

    /* =========================================================================
       BARRE LATÉRALE PERMANENTE PLEINE HAUTEUR (56 px, gauche ou droite)
       ========================================================================= */
    #sidebar {
      position: fixed;
      top: 0;
      bottom: 0;
      width: var(--sidebar-w);
      z-index: 40;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
    }

    /* Bloc HAUT : Accueil -> Horloge/Date -> Séparateur -> Barre des tâches alignée en haut */
    .sb-top {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: 100%;
    }

    .sb-sep {
      width: 22px;
      height: 1px;
      background: var(--separator);
    }

    .sb-clock {
      display: flex;
      flex-direction: column;
      align-items: center;
      line-height: 1.05;
      padding: 2px 0;
    }

    .sb-clock-time {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.01em;
    }

    .sb-clock-date {
      font-size: 9.5px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-top: 2px;
    }

    .sb-taskbar {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      width: 100%;
    }

    .sb-btn {
      position: relative;
      width: 38px;
      height: 38px;
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid transparent;
      transition: background 140ms ease, border-color 140ms ease, transform 120ms ease;
    }

    .sb-btn:hover {
      background: var(--hover);
    }

    .sb-btn:active {
      transform: scale(0.95);
    }

    .sb-btn.is-active {
      background: var(--card);
      border-color: var(--rim);
    }

    .sb-btn.is-running {
      background: color-mix(in srgb, var(--card) 65%, transparent);
    }

    /* Indicateurs bord extérieur (miroir gauche / droite) */
    .sb-mark {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      transition: all 160ms ease;
    }

    html[data-side="left"] .sb-mark { left: -9px; }
    html[data-side="right"] .sb-mark { right: -9px; }

    .sb-mark-bar {
      width: 3px;
      height: 20px;
      background: var(--accent);
    }

    html[data-side="left"] .sb-mark-bar { border-radius: 0 3px 3px 0; }
    html[data-side="right"] .sb-mark-bar { border-radius: 3px 0 0 3px; }

    .sb-mark-dot {
      width: 5px;
      height: 5px;
      border-radius: 999px;
      background: var(--accent);
      opacity: 0.85;
    }

    html[data-side="left"] .sb-mark-dot { left: -7px; }
    html[data-side="right"] .sb-mark-dot { right: -7px; }

    .sb-mark-ring {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      border: 1.6px solid var(--accent);
      background: transparent;
    }

    html[data-side="left"] .sb-mark-ring { left: -7px; }
    html[data-side="right"] .sb-mark-ring { right: -7px; }

    /* Pastille non lues (DANGER coquille, comme dock_dark.png) */
    .sb-badge {
      position: absolute;
      top: -3px;
      right: -3px;
      min-width: 16px;
      height: 16px;
      padding: 0 4px;
      border-radius: 999px;
      background: var(--danger);
      color: #fff;
      font-size: 9.5px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(229, 72, 77, 0.45);
    }

    /* Tooltips sobres en glass_strong, orientés selon le côté de la barre */
    .has-tip { position: relative; }
    .has-tip[data-tip]::after {
      content: attr(data-tip);
      position: absolute;
      top: 50%;
      white-space: nowrap;
      padding: 5px 10px;
      border-radius: 9px;
      font-size: 11.5px;
      font-weight: 500;
      background: var(--glass-strong);
      border: 1px solid var(--rim-bright);
      color: var(--text);
      box-shadow: 0 10px 24px var(--shadow);
      opacity: 0;
      pointer-events: none;
      transition: opacity 130ms ease, transform 130ms ease;
      z-index: 90;
    }

    html[data-side="left"] .has-tip[data-tip]::after {
      left: calc(100% + 12px);
      transform: translateY(-50%) translateX(-4px);
    }
    html[data-side="left"] .has-tip[data-tip]:hover::after {
      opacity: 1;
      transform: translateY(-50%) translateX(0);
    }

    html[data-side="right"] .has-tip[data-tip]::after {
      right: calc(100% + 12px);
      transform: translateY(-50%) translateX(4px);
    }
    html[data-side="right"] .has-tip[data-tip]:hover::after {
      opacity: 1;
      transform: translateY(-50%) translateX(0);
    }

    /* Bloc BAS : System Tray compact au-dessus de la pilule scindée */
    .sb-bottom {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      width: 100%;
    }

    .sb-tray {
      display: grid;
      grid-template-columns: repeat(2, 16px);
      gap: 5px;
      padding: 5px;
      border-radius: 10px;
      background: color-mix(in srgb, var(--card) 55%, transparent);
      border: 1px solid var(--separator);
    }

    .tray-dot {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      font-weight: 700;
      color: #fff;
      transition: transform 120ms ease;
    }

    .tray-dot:hover { transform: scale(1.12); }

    /* Pilule scindée en 2 zones cliquables : Cloche (Notifications) vs Système (Centre de contrôle) */
    .sb-pill {
      width: 38px;
      border-radius: 14px;
      background: var(--card);
      border: 1px solid var(--rim);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: inset 0 1px 0 var(--specular);
    }

    .sb-pill-zone {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 9px 0;
      color: var(--text);
      transition: background 140ms ease;
    }

    .sb-pill-zone:hover {
      background: var(--hover);
    }

    .sb-pill-zone.is-open {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .sb-pill-divider {
      width: 22px;
      height: 1px;
      margin: 0 auto;
      background: var(--separator);
    }

    .notif-dot {
      position: absolute;
      top: -2px;
      right: -2px;
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: var(--danger);
      box-shadow: 0 0 0 2px var(--surface);
    }

    /* =========================================================================
       POPOVERS DÉCOUPLÉS (Notifications SEUL ou Centre de contrôle SEUL + Mixeur)
       Réutilisation exacte des composants coquille existants
       ========================================================================= */
    .popover-anchor {
      position: fixed;
      bottom: 14px;
      z-index: 60;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      transition: opacity 170ms ease, transform 180ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    html[data-side="left"] .popover-anchor {
      left: calc(var(--sidebar-w) + 12px);
      flex-direction: row;
    }

    html[data-side="right"] .popover-anchor {
      right: calc(var(--sidebar-w) + 12px);
      flex-direction: row-reverse;
    }

    .popover-anchor.is-hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px) scale(0.98);
    }

    .coquille-popover {
      width: 348px;
      max-height: calc(100vh - 36px);
      border-radius: var(--radius-panel);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
    }

    .coquille-mixer {
      width: 300px;
      border-radius: var(--radius-panel);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .cc-card {
      background: var(--card);
      border-radius: var(--radius-card);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .cc-switches {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }

    .cc-switch {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 9px 10px;
      border-radius: 12px;
      background: var(--card);
      border: 1px solid transparent;
      text-align: left;
      transition: background 140ms ease, color 140ms ease;
    }

    .cc-switch:hover {
      background: var(--card-hover);
    }

    .cc-switch.on {
      background: var(--accent);
      color: var(--on-accent);
    }

    .cc-switch-title {
      font-size: 12.5px;
      font-weight: 600;
      line-height: 1.15;
    }

    .cc-switch-sub {
      font-size: 11px;
      opacity: 0.78;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cc-slider-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .cc-icon-btn {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--card);
      transition: background 130ms ease, color 130ms ease;
      flex-shrink: 0;
    }

    .cc-icon-btn:hover { background: var(--card-hover); }
    .cc-icon-btn.on { background: var(--accent); color: var(--on-accent); }

    .coquille-slider {
      -webkit-appearance: none;
      appearance: none;
      flex: 1;
      height: 5px;
      border-radius: 999px;
      background: var(--separator);
      outline: none;
      cursor: pointer;
    }

    .coquille-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 999px;
      background: var(--accent);
      border: 2px solid var(--surface);
      box-shadow: 0 2px 6px var(--shadow);
    }

    .cc-pill-badge {
      padding: 5px 10px;
      border-radius: 8px;
      background: var(--card);
      font-size: 11.5px;
      font-weight: 500;
      color: var(--text);
      white-space: nowrap;
    }

    .cc-session-who {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .cc-avatar {
      width: 36px;
      height: 36px;
      border-radius: 999px;
      background: var(--accent);
      color: var(--on-accent);
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .cc-session-actions {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
    }

    .cc-session-btn {
      height: 34px;
      border-radius: 10px;
      background: var(--card);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 130ms ease;
    }

    .cc-session-btn:hover { background: var(--card-hover); }
    .cc-session-btn.danger { background: var(--danger-soft); color: var(--danger); }
    .cc-session-btn.danger:hover { background: rgba(229, 72, 77, 0.26); }

    /* Notifications block (réutilisation exacte de ui/drawer.rs) */
    .notice-card {
      padding: 10px 11px;
      border-radius: 12px;
      background: var(--card);
      border: 1px solid var(--separator);
      display: flex;
      flex-direction: column;
      gap: 4px;
      cursor: pointer;
      transition: background 130ms ease;
    }

    .notice-card:hover { background: var(--card-hover); }

    .notice-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .notice-close {
      opacity: 0.45;
      width: 20px;
      height: 20px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .notice-close:hover { opacity: 1; background: var(--hover); }

    /* =========================================================================
       MENU CONTEXTUEL CLIC DROIT (conservé à l'identique)
       ========================================================================= */
    #context-menu {
      position: fixed;
      z-index: 80;
      width: 224px;
      border-radius: 14px;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .ctx-head {
      padding: 6px 8px 8px;
      border-bottom: 1px solid var(--separator);
      margin-bottom: 4px;
    }

    .ctx-screens {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      padding: 4px 2px 6px;
    }

    .ctx-screen-btn {
      padding: 5px 4px;
      border-radius: 8px;
      background: var(--card);
      font-size: 11px;
      font-weight: 500;
      text-align: center;
    }

    .ctx-screen-btn:hover { background: var(--accent); color: var(--on-accent); }

    .ctx-item {
      width: 100%;
      padding: 7px 9px;
      border-radius: 8px;
      text-align: left;
      font-size: 12.5px;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .ctx-item:hover { background: var(--hover); }
    .ctx-item.danger { color: var(--danger); }

    /* =========================================================================
       ZONE PRINCIPALE (Hors barre 56 px)
       ========================================================================= */
    #stage {
      position: fixed;
      top: 0;
      bottom: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    html[data-side="left"] #stage { left: var(--sidebar-w); right: 0; }
    html[data-side="right"] #stage { right: var(--sidebar-w); left: 0; }

    /* Fenêtre maximisée bord à bord (zéro marge, zéro capsule) */
    #maximized-view {
      position: absolute;
      inset: 0;
      z-index: 12;
      background: var(--surface);
      display: flex;
      flex-direction: column;
    }

    .max-bar {
      height: 40px;
      padding: 0 14px;
      border-bottom: 1px solid var(--separator);
      background: var(--glass);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .max-body {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
      background:
        radial-gradient(circle at 30% 25%, var(--accent-soft), transparent 55%),
        var(--surface);
    }

    /* =========================================================================
       LANCEUR SPATIAL :
       - Mode Bottom (permanent sur écran vide / toutes réduites : directement sur le wallpaper)
       - Mode Overlay (par-dessus une fenêtre maximisée : floutage complet du bureau ouvert)
       ========================================================================= */
    #spatial-launcher {
      position: absolute;
      inset: 0;
      z-index: 20;
      overflow-y: auto;
      padding: 46px 40px 28px;
      display: flex;
      flex-direction: column;
      gap: 22px;
      transition: background 200ms ease, backdrop-filter 200ms ease, opacity 180ms ease;
    }

    /* Sur écran vide : directement au-dessus du fond d'écran, zéro voile */
    #spatial-launcher.mode-bottom {
      background: transparent;
      backdrop-filter: none;
    }

    /* Par-dessus une fenêtre maximisée : floutage complet de la fenêtre dessous */
    #spatial-launcher.mode-overlay {
      background: var(--glass-overlay-bg);
      backdrop-filter: blur(30px) saturate(150%);
      -webkit-backdrop-filter: blur(30px) saturate(150%);
    }

    /* Recherche centrée */
    .search-wrap {
      width: 100%;
      max-width: 460px;
      margin: 0 auto;
      border-radius: 16px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .search-wrap:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-soft), 0 12px 32px -10px var(--shadow);
    }

    .search-input {
      width: 100%;
      background: transparent;
      border: 0;
      outline: none;
      font-size: 13.5px;
      font-weight: 500;
      user-select: text;
    }

    .search-input::placeholder { color: var(--muted); }

    /* Grille asymétrique 2 colonnes (42% / 58%) */
    .spatial-grid {
      width: 100%;
      max-width: 1440px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 5fr 7fr;
      gap: 18px;
      align-items: start;
      flex-shrink: 0;
    }

    @media (max-width: 1080px) {
      .spatial-grid { grid-template-columns: 1fr; }
    }

    .spatial-col {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .widget-card {
      border-radius: 20px;
      padding: 18px 20px;
    }

    .widget-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .widget-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .widget-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--accent);
    }

    .widget-title {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .widget-meta {
      font-size: 11.5px;
      font-weight: 500;
      color: var(--muted);
    }

    /* Vie quotidienne (tâches cochables) */
    .task-row {
      width: 100%;
      padding: 8px 10px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      text-align: left;
      transition: background 130ms ease, opacity 130ms ease;
    }

    .task-row:hover { background: var(--hover); }
    .task-row.done { opacity: 0.52; }

    .task-check {
      width: 17px;
      height: 17px;
      border-radius: 999px;
      border: 1.6px solid var(--muted);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .task-row.done .task-check {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--on-accent);
    }

    /* Tâches des projets */
    .ticket-row {
      width: 100%;
      padding: 10px 12px;
      border-radius: 13px;
      background: var(--card);
      border: 1px solid var(--separator);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      text-align: left;
      transition: background 130ms ease, border-color 130ms ease;
    }

    .ticket-row:hover {
      background: var(--card-hover);
      border-color: var(--rim);
    }

    .status-pill {
      padding: 3px 9px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* Jeux (3 cartes + édition inline du commentaire) */
    .games-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    @media (max-width: 720px) {
      .games-grid { grid-template-columns: 1fr; }
    }

    .game-card {
      position: relative;
      height: 152px;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--rim);
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: #fff;
      cursor: pointer;
      transition: transform 170ms cubic-bezier(0.22, 1, 0.36, 1), border-color 170ms ease;
    }

    .game-card:hover {
      transform: translateY(-2px);
      border-color: var(--rim-bright);
    }

    .game-card::after {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--game-scrim);
      pointer-events: none;
    }

    .game-top, .game-bottom {
      position: relative;
      z-index: 2;
    }

    .game-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .game-pill {
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(16, 14, 28, 0.48);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      font-size: 10.5px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.9);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .game-play {
      width: 28px;
      height: 28px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.28);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      flex-shrink: 0;
      transition: background 140ms ease, transform 140ms ease;
    }

    .game-card:hover .game-play {
      background: var(--accent);
      color: var(--on-accent);
      border-color: transparent;
      transform: scale(1.06);
    }

    .game-note-row {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 3px;
      padding: 2px 5px;
      margin-left: -5px;
      border-radius: 7px;
      transition: background 130ms ease;
    }

    .game-note-row:hover {
      background: rgba(255, 255, 255, 0.16);
    }

    .game-note-text {
      font-size: 11.5px;
      color: rgba(255, 255, 255, 0.84);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .game-note-edit-icon {
      opacity: 0;
      transition: opacity 130ms ease;
      flex-shrink: 0;
    }

    .game-card:hover .game-note-edit-icon { opacity: 0.85; }

    .game-note-input {
      width: 100%;
      margin-top: 3px;
      padding: 3px 7px;
      border-radius: 7px;
      border: 1px solid rgba(255, 255, 255, 0.45);
      background: rgba(14, 12, 26, 0.72);
      color: #fff;
      font-size: 11.5px;
      outline: none;
      user-select: text;
    }

    /* Agenda 7 jours */
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    @media (max-width: 720px) {
      .cal-grid { grid-template-columns: 1fr; }
    }

    .cal-item {
      padding: 9px 11px;
      border-radius: 13px;
      background: var(--card);
      border: 1px solid var(--separator);
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: left;
      transition: background 130ms ease;
    }

    .cal-item:hover { background: var(--card-hover); }
    .cal-item.today { border-color: color-mix(in srgb, var(--accent) 45%, transparent); }

    .cal-stripe {
      width: 3.5px;
      height: 30px;
      border-radius: 999px;
      flex-shrink: 0;
    }

    /* Grille flottante GNOME (zéro carte au repos, gabarit Reversal / icons::tile) */
    .apps-section {
      width: 100%;
      max-width: 1140px;
      margin: 4px auto 0;
      flex-shrink: 0;
    }

    .apps-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 14px 10px;
    }

    @media (max-width: 1120px) { .apps-grid { grid-template-columns: repeat(6, 1fr); } }
    @media (max-width: 740px) { .apps-grid { grid-template-columns: repeat(4, 1fr); } }

    .app-tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      padding: 10px 6px 8px;
      border-radius: 16px;
      background: transparent;
      border: 1px solid transparent;
      transition: background 150ms ease, transform 160ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .app-tile:hover {
      background: var(--hover);
      transform: translateY(-2px);
    }

    .app-tile:active { transform: scale(0.96); }

    .app-icon-box {
      width: 52px;
      height: 52px;
      border-radius: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 6px 12px var(--shadow));
      transition: transform 160ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .app-tile:hover .app-icon-box { transform: scale(1.05); }

    .app-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text);
      text-shadow: var(--label-shadow);
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: center;
    }

    .app-dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
    }

    .app-dot.here { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
    .app-dot.elsewhere { border: 1.5px solid var(--accent); background: transparent; }
    .app-dot.none { opacity: 0; }

    /* =========================================================================
       BARRE DE SIMULATION DISCRÈTE (Haut droit / gauche selon côté de la barre)
       ========================================================================= */
    #sim-bar {
      position: fixed;
      top: 10px;
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 500;
    }

    html[data-side="left"] #sim-bar { right: 16px; left: auto; }
    html[data-side="right"] #sim-bar { left: 16px; right: auto; }

    .seg {
      display: flex;
      gap: 2px;
      padding: 2px;
      border-radius: 999px;
      background: var(--card);
    }

    .seg button {
      padding: 3px 8px;
      border-radius: 999px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 500;
      transition: background 130ms ease, color 130ms ease;
    }

    .seg button.active {
      background: var(--accent);
      color: var(--on-accent);
      font-weight: 600;
    }

    /* Toast micro-feedback */
    #toast {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%) translateY(8px);
      z-index: 95;
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
      opacity: 0;
      pointer-events: none;
      transition: opacity 160ms ease, transform 160ms ease;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Scrollbar discrète */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--separator); border-radius: 999px; }
  </style>
</head>
<body>
  <!-- 1. FOND D'ÉCRAN LIQUID GLASS COQUILLE -->
  <div id="wallpaper">
    <div class="wp-arch wp-arch-1"></div>
    <div class="wp-arch wp-arch-2"></div>
    <div class="wp-arch wp-arch-3"></div>
    <div class="wp-arch wp-arch-4"></div>
  </div>

  <!-- 2. BARRE DE SIMULATION (multi-écrans, thème clair/sombre, côté gauche/droite, profil) -->
  <div id="sim-bar" class="liquid-panel">
    <div class="seg" title="Écran simulé">
      <button id="scr-left" onclick="setScreen('left')">Gauche</button>
      <button id="scr-center" class="active" onclick="setScreen('center')">Centre 21:9</button>
      <button id="scr-right" onclick="setScreen('right')">Droite</button>
    </div>
    <div class="seg" title="Thème coquille">
      <button id="th-dark" class="active" onclick="setTheme('dark')">Sombre</button>
      <button id="th-light" onclick="setTheme('light')">Clair</button>
    </div>
    <div class="seg" title="Côté de la barre verticale">
      <button id="side-left" class="active" onclick="setSide('left')">Barre G</button>
      <button id="side-right" onclick="setSide('right')">Barre D</button>
    </div>
    <div class="seg" title="Machine">
      <button id="host-zenbook" class="active" onclick="setHost('zenbook')">Zenbook</button>
      <button id="host-titan" onclick="setHost('titan')">TITAN</button>
    </div>
  </div>

  <!-- 3. BARRE LATÉRALE PERMANENTE PLEINE HAUTEUR (56 px, Liquid Glass) -->
  <aside id="sidebar" class="liquid-bar">
    <!-- HAUT : Accueil -> Horloge/Date -> Séparateur -> Barre des tâches alignée en haut -->
    <div class="sb-top">
      <button id="btn-home" class="sb-btn has-tip" onclick="toggleHomeOverlay()" data-tip="Lanceur spatial (Super)" aria-label="Accueil">
        <span id="home-mark" class="sb-mark sb-mark-bar"></span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <rect x="3" y="3" width="8" height="8" rx="2.2" />
          <rect x="13" y="3" width="8" height="8" rx="2.2" opacity="0.78" />
          <rect x="3" y="13" width="8" height="8" rx="2.2" opacity="0.78" />
          <rect x="13" y="13" width="8" height="8" rx="2.2" opacity="0.58" />
        </svg>
      </button>

      <div id="clock-box" class="sb-clock has-tip" data-tip="Vendredi 27 novembre 2026">
        <span id="clock-time" class="sb-clock-time tabular">13:39</span>
        <span id="clock-date" class="sb-clock-date tabular">VEN 27</span>
      </div>

      <div class="sb-sep"></div>

      <!-- Barre des tâches alignée en haut -->
      <div id="taskbar" class="sb-taskbar"></div>
    </div>

    <!-- BAS : System Tray compact au-dessus de la pilule scindée (Cloche vs Contrôles) -->
    <div class="sb-bottom">
      <!-- Zone System Tray (SNI / XEmbed) -->
      <div class="sb-tray has-tip" data-tip="Icônes d'état (SNI / XEmbed)">
        <button class="tray-dot" style="background:#5865f2" onclick="toast('Icône tray : Discord')" title="Discord">D</button>
        <button class="tray-dot" style="background:#1b73b8" onclick="toast('Icône tray : Steam')" title="Steam">S</button>
        <button class="tray-dot" style="background:#ea580c" onclick="toast('Icône tray : Mises à jour')" title="Mises à jour">M</button>
        <button class="tray-dot" style="background:#475569" onclick="toast('Icône tray : Presse-papiers')" title="Presse-papiers">C</button>
      </div>

      <!-- Pilule unique à 2 zones cliquables distinctes -->
      <div class="sb-pill">
        <!-- Zone 1 : Cloche -> ouvre UNIQUEMENT les Notifications -->
        <button id="pill-notifs" class="sb-pill-zone has-tip" onclick="togglePopover('notifications')" data-tip="Notifications">
          <span style="position:relative;display:flex;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 2h-15z" />
              <path d="M10 20.5a2.2 2.2 0 0 0 4 0" />
            </svg>
            <span id="pill-notif-dot" class="notif-dot"></span>
          </span>
        </button>

        <div class="sb-pill-divider"></div>

        <!-- Zone 2 : Reste de la pilule -> ouvre UNIQUEMENT le Centre de contrôle (+ Mixeur) -->
        <button id="pill-controls" class="sb-pill-zone has-tip" onclick="togglePopover('controls')" data-tip="Centre de contrôle">
          <svg id="pill-wifi" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12.55a11 11 0 0 1 14.08 0" />
            <path d="M8.53 16.11a6 6 0 0 1 6.95 0" />
            <circle cx="12" cy="19.5" r="1" fill="currentColor" stroke="none" />
          </svg>
          <svg id="pill-audio-hp" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 15v-3a8 8 0 0 1 16 0v3" />
            <rect x="3" y="14" width="4" height="6" rx="1.5" />
            <rect x="17" y="14" width="4" height="6" rx="1.5" />
          </svg>
          <svg id="pill-audio-sp" class="hidden" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" />
            <path d="M15.5 9a4 4 0 0 1 0 6" />
          </svg>
          <svg id="pill-battery" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2.5" y="7" width="17" height="10" rx="2.5" />
            <path d="M22 10.5v3" />
            <path d="M12 9.2 9.5 12.4h3l-2.5 3.2" stroke-width="1.6" />
          </svg>
        </button>
      </div>
    </div>
  </aside>

  <!-- 4. POPOVERS DÉCOUPLÉS (Notifications SEUL ou Centre de contrôle SEUL + Mixeur) -->
  <div id="popover-anchor" class="popover-anchor is-hidden">
    <!-- Popover principal (soit Notifications, soit Centre de contrôle) -->
    <div id="popover-body" class="coquille-popover liquid-strong"></div>
    <!-- Panneau Mixeur par application (existant coquille, à côté du Centre de contrôle) -->
    <div id="mixer-panel" class="coquille-mixer liquid-strong hidden"></div>
  </div>

  <!-- 5. MENU CONTEXTUEL CLIC DROIT (conservé) -->
  <div id="context-menu" class="liquid-strong hidden"></div>

  <!-- 6. SCÈNE PRINCIPALE (hors barre 56 px) -->
  <main id="stage">
    <!-- Fenêtre maximisée bord à bord (quand l'écran a une fenêtre ouverte non réduite) -->
    <section id="maximized-view" class="hidden">
      <div class="max-bar">
        <div style="display:flex;align-items:center;gap:10px;min-width:0;">
          <span id="max-icon" style="display:flex;"></span>
          <strong id="max-title" style="font-size:13.5px;font-weight:600;"></strong>
          <span id="max-screen-badge" class="cc-pill-badge" style="font-size:11px;padding:3px 9px;"></span>
        </div>
        <div style="display:flex;align-items:center;gap:6px;">
          <button class="cc-pill-badge" onclick="minimizeActiveApp()" title="Réduire : si aucune autre fenêtre n'est visible, le Lanceur Spatial apparaît automatiquement">Réduire</button>
          <button class="cc-pill-badge" style="background:var(--danger-soft);color:var(--danger);" onclick="closeActiveApp()">Fermer</button>
        </div>
      </div>
      <div id="max-body" class="max-body"></div>
    </section>

    <!-- LANCEUR SPATIAL :
         - mode-bottom : ouvert AUTOMATIQUEMENT sur tout écran sans fenêtre visible
         - mode-overlay : ouvert par-dessus une fenêtre maximisée avec floutage complet -->
    <section id="spatial-launcher" class="mode-bottom">
      <!-- Barre de recherche centrée -->
      <div class="search-wrap liquid-panel">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round">
          <circle cx="11" cy="11" r="7" />
          <path d="M20.5 20.5 16 16" />
        </svg>
        <input id="search-input" class="search-input" type="text" placeholder="Rechercher une application ou un jeu…" oninput="onSearch(this.value)" onkeydown="onSearchKey(event)" />
        <button id="search-clear" class="hidden" onclick="clearSearch()" style="color:var(--muted);display:flex;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
      </div>

      <!-- 2 colonnes asymétriques : Vie quotidienne / Tâches des projets | Jeux / Agenda 7 jours -->
      <div class="spatial-grid">
        <div class="spatial-col">
          <!-- Vie quotidienne -->
          <div class="widget-card liquid-panel">
            <div class="widget-head">
              <div class="widget-title-row">
                <span class="widget-dot"></span>
                <span class="widget-title">Vie quotidienne</span>
              </div>
              <span id="tasks-meta" class="widget-meta tabular"></span>
            </div>
            <div id="tasks-list" style="display:flex;flex-direction:column;gap:2px;"></div>
          </div>

          <!-- Tâches des projets -->
          <div class="widget-card liquid-panel">
            <div class="widget-head">
              <div class="widget-title-row">
                <span class="widget-dot"></span>
                <span class="widget-title">Tâches des projets</span>
              </div>
              <span class="widget-meta">Données simulées</span>
            </div>
            <div id="projects-list" style="display:flex;flex-direction:column;gap:8px;"></div>
          </div>
        </div>

        <div class="spatial-col">
          <!-- Jeux (avec édition à la volée du commentaire) -->
          <div class="widget-card liquid-panel">
            <div class="widget-head">
              <div class="widget-title-row">
                <span class="widget-dot"></span>
                <span class="widget-title">Jeux</span>
              </div>
              <span class="widget-meta">Clic sur le commentaire pour éditer</span>
            </div>
            <div id="games-grid" class="games-grid"></div>
          </div>

          <!-- Agenda · 7 jours -->
          <div class="widget-card liquid-panel">
            <div class="widget-head">
              <div class="widget-title-row">
                <span class="widget-dot"></span>
                <span class="widget-title">Agenda · 7 jours</span>
              </div>
              <span id="cal-range" class="widget-meta tabular"></span>
            </div>
            <div id="cal-grid" class="cal-grid"></div>
          </div>
        </div>
