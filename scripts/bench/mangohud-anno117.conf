# MangoHud benchmark configuration for Anno 117 (Coquille vs GNOME)
# Used by scripts/bench/launch-anno117.sh (output_folder is appended dynamically).

# Log every single frame (0 ms interval) for accurate 1% / 0.1% lows and stutter analysis
log_interval=0
log_duration=60
toggle_logging=Shift_L+F2
benchmark_percentiles=97,AVG,1,0.1

# Minimal HUD during capture to avoid HUD rendering overhead
legacy_layout=false
fps
frametime
frame_timing=0
gpu_stats
gpu_temp
cpu_stats
vram
ram
present_mode
font_size=20
position=top-left
background_alpha=0.35
