[package]
name = "coquille-dock"
description = "The dock of the coquille shell: bar, application drawer, control center, mixer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
coquille-ipc.workspace = true
coquille-model.workspace = true
serde.workspace = true
serde_json = "1"
toml_edit = "0.25"
freedesktop-icons = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "process", "rt", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
iced = { version = "0.14", default-features = false, features = ["wgpu", "tiny-skia", "wayland", "crisp", "web-colors", "tokio", "svg", "image", "advanced"] }
iced_layershell = "0.19.1"

[lints]
workspace = true
