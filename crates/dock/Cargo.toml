[package]
name = "coquille-dock"
description = "The dock of the coquille shell: bar, application drawer, control center, mixer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
coquille-apps.workspace = true
coquille-config.workspace = true
coquille-ipc.workspace = true
coquille-model.workspace = true
coquille-theme.workspace = true
coquille-ui.workspace = true
serde.workspace = true
serde_json = "1"
toml_edit.workspace = true
ureq = "3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
iced.workspace = true
iced_layershell = "0.19.1"
system-tray = { version = "0.8.9", default-features = false, features = ["data"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
x11rb = { version = "0.13", features = ["composite", "damage"] }

[lints]
workspace = true
