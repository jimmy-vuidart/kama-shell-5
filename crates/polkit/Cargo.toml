[package]
name = "coquille-polkit"
description = "The polkit agent of the coquille shell: asks for the password an administrative action needs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
coquille-config.workspace = true
coquille-ipc.workspace = true
coquille-ui.workspace = true
clap = { version = "4", features = ["derive"] }
futures-util = { version = "0.3", default-features = false }
iced.workspace = true
iced_layershell = "0.19.1"
tokio = { workspace = true, features = ["signal"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
zeroize = "1"

[lints]
workspace = true
