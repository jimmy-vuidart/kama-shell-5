# Portals of the coquille session (xdg-desktop-portal), installed as
# ~/.config/xdg-desktop-portal/coquille-portals.conf.
#
# Sandboxed applications (Flatpak) get their secret from the keyring of
# coquille, which serves org.freedesktop.secrets. `coquille` is its own
# portal file, put in /usr/share/xdg-desktop-portal/portals/ by
# `scripts/install.sh --session`; until then, the one of gnome-keyring names
# the same bus name, and so reaches the same keyring.
#
# The other portals are not named here: they keep what xdg-desktop-portal
# chooses for a desktop it does not know.
[preferred]
org.freedesktop.impl.portal.Secret=coquille;gnome-keyring
