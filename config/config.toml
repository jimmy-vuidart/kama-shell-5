# Configuration de coquille : à placer dans ~/.config/coquille/config.toml.
# Tout est facultatif ; une ligne absente garde la valeur par défaut.
#
# Les réglages généraux viennent d'abord : en TOML, tout ce qui suit un titre
# de section comme [outputs] appartient à cette section.

# Thème des décorations et du dock : "light" ou "dark". La bascule « Thème
# sombre » du centre de contrôle réécrit cette ligne.
# theme = "light"

# Couleur d'accent (anneau de la fenêtre active, dock), en #rrggbb ; par
# défaut celle du thème : #2f6fed en clair, #7aa7ff en sombre.
# accent = "#2f6fed"

# Terminal ouvert par Super+Entrée ; par défaut le premier trouvé parmi
# kitty, alacritty et foot.
# terminal = "kitty"

# Applications X11 (dont beaucoup de jeux, via Steam et Proton) : elles
# passent par XWayland, démarré avec le compositeur. `false` s'en passe.
# xwayland = true

# Quel connecteur est quel écran. Sans cette section, l'écran le plus large
# est le centre et les deux autres sont pris dans l'ordre des connecteurs.
[outputs]
left = "HDMI-A-1"
center = "DP-2"
right = "DP-1"

# Disposition du clavier ; par défaut, celle du système.
# [keyboard]
# layout = "fr"
# variant = ""

# Mode jeu : ce qui se passe sur un écran occupé par une fenêtre en plein écran.
[game]
# Bords collants : durée (en millisecondes) pendant laquelle il faut pousser le
# curseur contre le bord pour quitter l'écran du jeu. 0 les désactive.
# sticky_edges_ms = 300

# Affichage direct : l'image du jeu est envoyée telle quelle à l'écran, sans
# être redessinée, tant que rien d'autre n'est affiché sur son écran (pointeur
# compris). En cas de souci d'affichage en jeu, mettre `false`.
# direct_scanout = true

# Fréquence variable (VRR, G-Sync/FreeSync) : activée sur l'écran d'un jeu si
# l'écran et le pilote la proposent. En cas de scintillement, mettre `false`.
# vrr = true

# Le dock, sur l'écran gauche. Les applications de la barre, dans l'ordre :
# le nom de leur fichier .desktop (sans l'extension) ou ce que leurs fenêtres
# annoncent. Le menu au clic droit (« Épingler », « Retirer des favoris ») et
# le glisser dans la barre réécrivent cette liste.
[dock]
favorites = ["firefox", "discord", "kitty", "code", "obsidian"]

# Le tiroir d'applications. Les applications épinglées en haut du tiroir ;
# sans cette ligne, ce sont les favoris de la barre.
[drawer]
# pinned = ["firefox", "discord", "kitty", "code", "obsidian", "mpv", "org.gnome.Nautilus"]

# Largeur du tiroir, en pixels. Tirer son bord droit à la souris la change
# et réécrit cette ligne.
# width = 640
