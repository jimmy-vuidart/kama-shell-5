# Configuration de coquille : à placer dans ~/.config/coquille/config.toml.
# Tout est facultatif ; une ligne absente garde la valeur par défaut.
# L'écran « Paramètres » (bouton du dock) règle la plupart de ces lignes à la
# souris, sans toucher au reste du fichier.
#
# Les réglages généraux viennent d'abord : en TOML, tout ce qui suit un titre
# de section comme [outputs] appartient à cette section.

# Thème des décorations et du dock : "light" ou "dark". La bascule « Thème
# sombre » du centre de contrôle réécrit cette ligne.
# theme = "light"

# Couleur d'accent (anneau de la fenêtre active, dock), en #rrggbb ; par
# défaut celle du thème : #5b63e6 en clair, #8f97ff en sombre.
# accent = "#5b63e6"

# Terminal ouvert par Super+Entrée ; par défaut le premier trouvé parmi
# kitty, alacritty et foot.
# terminal = "kitty"

# Applications X11 (dont beaucoup de jeux, via Steam et Proton) : elles
# passent par XWayland, démarré avec le compositeur. `false` s'en passe.
# xwayland = true

# Quel connecteur est quel écran. Sans cette section, l'écran le plus large
# est le centre et les deux autres sont pris dans l'ordre des connecteurs.
[outputs]
left = "HDMI-A-1"
center = "DP-2"
right = "DP-1"

# Disposition du clavier ; par défaut, celle du système.
# Verr. Num. est allumé au démarrage ; `numlock = false` le laisse éteint.
# [keyboard]
# layout = "fr"
# variant = ""
# numlock = true

# Souris : vitesse du pointeur, profil d'accélération, défilement et boutons.
# [mouse]
# accel_speed = 0.0
# accel_profile = "adaptive"
# natural_scroll = false
# left_handed = false

# Le pavé tactile d'un portable (la souris garde ses propres réglages) :
# toucher pour cliquer, toucher puis glisser pour déplacer, pavé coupé
# pendant la frappe, défilement naturel (le contenu suit les doigts),
# vitesse de -1.0 à 1.0, et clic droit à deux doigts ("clickfinger") ou
# dans le coin bas droit ("areas"). L'écran « Paramètres » réécrit ces
# lignes.
[touchpad]
# tap = true
# tap_drag = true
# disable_while_typing = true
# natural_scroll = true
# accel_speed = 0.0
# click_method = "clickfinger"

# Mode jeu : ce qui se passe sur un écran occupé par une fenêtre en plein écran.
[game]
# Bords collants : durée (en millisecondes) pendant laquelle il faut pousser le
# curseur contre le bord pour quitter l'écran du jeu. 0 les désactive.
# sticky_edges_ms = 300

# Affichage direct : l'image du jeu est envoyée telle quelle à l'écran, sans
# être redessinée, tant que rien d'autre n'est affiché sur son écran (pointeur
# compris). En cas de souci d'affichage en jeu, mettre `false`.
# direct_scanout = true

# Fréquence variable (VRR, G-Sync/FreeSync) : activée sur l'écran d'un jeu si
# l'écran et le pilote la proposent. En cas de scintillement, mettre `false`.
# vrr = true

# Disposition de chaque écran : jusqu'à combien de colonnes les fenêtres
# rangées se partagent l'écran. Une seule fenêtre rangée prend tout l'écran,
# deux se le partagent, et ainsi de suite jusqu'au maximum ; au-delà, elles
# s'empilent en onglets. "full" (plein écran : une colonne), "two-columns"
# (deux colonnes, moitié-moitié), "three-columns" (trois colonnes, un tiers
# chacune) ou "main-side" (maître à gauche, deux tiers, et esclave à droite,
# un tiers). Super + glisser une séparation règle les largeurs, gardées d'une
# session à l'autre. L'écran « Paramètres » réécrit ces lignes.
# Sans cette section : deux colonnes sur les côtés, plein écran au centre.
[layout]
# left = "two-columns"
# center = "full"
# right = "two-columns"

# Mise à l'échelle de chaque écran : de 1.0 (100 %) à 3.0 (300 %), par pas de
# 0.25. Un écran 4K de portable est confortable à 2.0. Les applis X11 voient
# toujours les vrais pixels, et prennent l'échelle la plus grande au
# démarrage seulement. L'écran « Paramètres » réécrit ces lignes.
# Sans cette section : 100 % partout.
[scale]
# left = 1.0
# center = 1.0
# right = 1.0

# Le dock, sur l'écran gauche. Les applications de la barre, dans l'ordre :
# le nom de leur fichier .desktop (sans l'extension) ou ce que leurs fenêtres
# annoncent. Le menu au clic droit (« Épingler », « Retirer des favoris ») et
# le glisser dans la barre réécrivent cette liste.
[dock]
favorites = ["firefox", "discord", "kitty", "code", "obsidian"]

# Taille des icônes de la barre, en pixels (par défaut 24). La barre et sa
# zone réservée s'ajustent automatiquement.
# icon_size = 24

# Quel écran a un dock, et dans quel sens : "vertical" (colonne sur le bord
# gauche, lanceur en tiroir), "vertical-right" (la même sur le bord droit),
# "horizontal" (rangée sur le bord bas, lanceur en tiroir de toute la largeur) ou
# "off". Sans cette section : un dock vertical sur l'écran gauche, aucun
# ailleurs ; un écran seul (un portable) a toujours le sien, sauf "off".
[dock.screens]
# left = "vertical"
# center = "off"
# right = "off"

# Le tiroir d'applications. Les applications épinglées en haut du tiroir ;
# sans cette ligne, ce sont les favoris de la barre.
[drawer]
# pinned = ["firefox", "discord", "kitty", "code", "obsidian", "mpv", "org.gnome.Nautilus"]

# Largeur du tiroir, en pixels. Tirer à la souris son bord opposé au dock la
# change et réécrit cette ligne.
# width = 640

# Hauteur du lanceur d'un dock horizontal, en pixels (la barre en plus). Tirer
# son bord haut la change et réécrit cette ligne. Sans elle, 600 px sur un
# écran de 1080, et autant de plus sur un écran plus haut (800 en 1440).
# height = 600

# Fond d'écran : image affichée en arrière-plan de chaque écran.
# Sans cette section, le fond « glass » adapté à la définition de chaque écran
# est utilisé, dans sa version de nuit en thème sombre.
# [wallpaper]
# path = "/chemin/vers/image.png"
# left = "/chemin/vers/gauche.png"
# center = "/chemin/vers/centre.png"
# right = "/chemin/vers/droite.png"
# mode = "fill"
# Version du fond « glass » sur les écrans 16:9 : "1080p" ou "4k". Sans ce
# réglage, celle qui convient à la définition de l'écran.
# definition = "4k"

# Périphériques audio de sortie : sélecteur rapide du lanceur et surnoms.
# [audio]
# Périphériques masqués du sélecteur rapide
# hidden = ["alsa_output.pci-0000_01_00.1.hdmi-stereo-extra1"]

# Surnoms donnés aux périphériques de sortie
# [audio.nicks]
# "alsa_output.usb-Generic_USB_Audio-00.HiFi__Headphones__sink" = "Casque"

# Rendu du verre liquide : flou d'arrière-plan sous les surfaces du shell.
# `blur = false` désactive le flou (les surfaces restent translucides).
# `strength` règle la force du flou de 1 à 5 (défaut : 3).
# [glass]
# blur = true
# strength = 3

